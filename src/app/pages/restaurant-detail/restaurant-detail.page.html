<ion-content [fullscreen]="true" style="--background: #f4f5f8;">
  
  <!-- Hero Banner Section (Dynamically uses vendor background banner) -->
  <div class="animate-fade-down" [style.background]="'url(\'' + vendor.banner + '\') center/cover no-repeat'" style="position: relative; height: 310px;">
    
    <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(109,26,29,0.92) 100%);"></div>

    <!-- Navigation Header -->
    <div style="position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; backdrop-filter: blur(4px); background: rgba(0,0,0,0.2);">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/dashboard" color="light" text=""></ion-back-button>
      </ion-buttons>
      <h2 style="font-size: 1.1rem; font-weight: 700; color: #fff; margin: 0; letter-spacing: 0.3px;">Store Detail</h2>
      
      <!-- Cart Icon Link -->
      <a [routerLink]="['/cart']" class="interactive-bounce" style="color: white; display: flex; align-items: center; text-decoration: none; position: relative; background: rgba(255,255,255,0.25); padding: 8px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
        <ion-icon name="cart-outline" style="font-size: 1.2rem;"></ion-icon>
      </a>
    </div>

    <!-- Store Info Overlay -->
    <div style="position: absolute; bottom: 32px; left: 20px; right: 20px; z-index: 10; color: #fff;">
      <h1 style="font-size: 1.6rem; font-weight: 900; margin: 0 0 4px 0; text-shadow: 0 2px 6px rgba(0,0,0,0.4); letter-spacing: -0.3px;">{{ vendor.name }}</h1>
      <p style="font-size: 0.83rem; margin: 0 0 10px 0; color: rgba(255,255,255,0.92); font-weight: 600;">{{ vendor.category }}</p>
      
      <div style="display: flex; align-items: center; gap: 16px; font-size: 0.8rem; color: rgba(255,255,255,0.95); font-weight: 600;">
        <span style="display: flex; align-items: center; gap: 6px;">
          <ion-icon name="location-outline" style="color: #ffb800; font-size: 1.1rem;"></ion-icon> {{ vendor.location }}
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
          <ion-icon name="time-outline" style="color: #ffb800; font-size: 1.1rem;"></ion-icon> {{ vendor.eta }}
        </span>
      </div>
    </div>
  </div>

  <!-- Main Content Body -->
  <div class="animate-slide-up" style="background: #ffffff; border-top-left-radius: 32px; border-top-right-radius: 32px; margin-top: -16px; padding: 26px 18px 45px 18px; position: relative; z-index: 20; min-height: 60vh; box-shadow: 0 -15px 35px rgba(0,0,0,0.1);">
    
    <!-- Rating Card Box -->
    <div style="display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #fffbf5 0%, #fff6e8 100%); border: 1px solid #feeeca; padding: 16px 20px; border-radius: 20px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(255,184,0,0.08);">
      <div>
        <span style="font-size: 0.75rem; font-weight: 800; color: #886300; text-transform: uppercase; letter-spacing: 0.8px; display: block; margin-bottom: 6px;">Restaurant Rating</span>
        <div style="display: flex; gap: 4px;">
          <ion-icon *ngFor="let star of getVendorStars()" [name]="star" style="color: #ffb800; font-size: 1.15rem;"></ion-icon>
        </div>
      </div>
      <div style="text-align: right;">
        <span style="font-size: 1.4rem; font-weight: 900; color: #6d1a1d; line-height: 1;">{{ vendor.rating }}</span>
        <span style="font-size: 0.75rem; color: #777; display: block; margin-top: 4px; font-weight: 600;">({{ vendor.reviews }})</span>
      </div>
    </div>

    <!-- Category Filter Tabs -->
    <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px; scrollbar-width: none;">
      <button *ngFor="let cat of menuCategories" 
              (click)="selectedCategory = cat"
              [style.background]="selectedCategory === cat ? 'linear-gradient(135deg, #6d1a1d 0%, #4a1012 100%)' : '#f1f3f5'"
              [style.color]="selectedCategory === cat ? '#ffffff' : '#495057'"
              class="category-btn"
              style="border: none; padding: 10px 20px; border-radius: 24px; font-size: 0.86rem; font-weight: 700; white-space: nowrap; cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 2px 6px rgba(0,0,0,0.04);">
        {{ cat }}
      </button>
    </div>

    <!-- Menu Items Grid (Dynamically filtered) -->
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
      <div *ngFor="let item of filteredItems; let i = index" class="menu-card" [style.animation-delay]="(i * 0.1) + 's'" style="background: #ffffff; border: 1px solid #eaeaea; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 6px 18px rgba(0,0,0,0.04);">
        
        <!-- Image Container -->
        <div style="position: relative; height: 130px; background: #f8f9fa; overflow: hidden;">
          <img [src]="item.image" [alt]="item.name" class="food-img" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease;" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80'" />
          
          <!-- Add Button -->
          <button (click)="addToCart(item)" class="interactive-bounce" style="position: absolute; bottom: 10px; right: 10px; background: linear-gradient(135deg, #ff9933 0%, #ff6600 100%); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px rgba(255,102,0,0.4);">
            <ion-icon name="add-outline" style="font-size: 1.25rem;"></ion-icon>
          </button>
        </div>

        <!-- Item Info Block -->
        <div style="padding: 14px 14px 16px 14px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between;">
          <div>
            <h4 style="margin: 0 0 6px 0; font-size: 0.92rem; font-weight: 800; color: #212529; line-height: 1.3;">{{ item.name }}</h4>
            
            <!-- Item Rating Stars -->
            <div style="display: flex; align-items: center; gap: 3px; margin-bottom: 12px;">
              <ion-icon *ngFor="let star of getItemStars(item.rating)" [name]="star" style="color: #ffb800; font-size: 0.8rem;"></ion-icon>
              <span style="font-size: 0.75rem; color: #666; font-weight: 700; margin-left: 4px;">{{ item.rating }}</span>
            </div>
          </div>

          <!-- Price Display -->
          <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 4px;">
            <span style="font-size: 1.05rem; font-weight: 900; color: #6d1a1d;">₱{{ item.price.toFixed(2) }}</span>
          </div>
        </div>

      </div>
    </div>

  </div>
</ion-content>
