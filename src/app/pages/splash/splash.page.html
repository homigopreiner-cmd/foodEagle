<ion-content [fullscreen]="true" class="splash-bg">
  
  <!-- Ambient Background Particle / Glow Elements -->
  <div class="ambient-glow glow-one"></div>
  <div class="ambient-glow glow-two"></div>

  <div class="splash-container">
    
    <!-- Floating Emblem Card -->
    <div class="logo-wrapper">
      <div class="ring-pulse"></div>
      <div class="logo-card">
        <img src="assets/images/food-eagle-logo.png" alt="Food Eagle Logo" class="logo" onerror="this.src='assets/images/placeholder.jpg'" />
      </div>
    </div>

    <!-- Title & Tagline with Custom Crossed-Out Word -->
    <div class="text-content">
      <h1 class="brand-title">foodEagle</h1>
      <p class="brand-tagline">
        NEVER GROW <span class="crossed-word">OLD</span> HUNGRY
      </p>
    </div>

    <!-- Animated Loading Progress Bar -->
    <div class="loader-track">
      <div class="loader-fill"></div>
    </div>

  </div>
</ion-content>
