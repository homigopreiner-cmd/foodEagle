<ion-content [fullscreen]="true" style="--background: #5c0c0e;">
  
  <!-- Header Bar -->
  <div style="background-color: #5c0c0e; color: #ffffff; padding: 16px 20px 32px 20px; display: flex; align-items: center; justify-content: space-between;">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="light"></ion-back-button>
    </ion-buttons>
    <h2 style="font-size: 1.3rem; font-weight: 700; margin: 0; flex: 1; text-align: center;">My Food Cart</h2>
    <div style="width: 32px;"></div> <!-- Spacer for balance -->
  </div>

  <!-- Cart Content Sheet -->
  <div style="background: #ffffff; margin: -16px 16px 24px 16px; padding: 20px 16px; border-radius: 26px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);">
    
    <!-- Empty Cart State -->
    <div *ngIf="items.length === 0" style="text-align: center; padding: 40px 0; color: #8e8e93;">
      <ion-icon name="cart-outline" style="font-size: 3.5rem; color: #d1d1d6; margin-bottom: 10px;"></ion-icon>
      <p style="font-weight: 600; font-size: 1rem; margin: 0;">Your cart is empty</p>
      <p style="font-size: 0.8rem; margin-top: 4px;">Add delicious campus meals to get started!</p>
    </div>

    <!-- Item List -->
    <div *ngIf="items.length > 0">
      <div *ngFor="let item of items" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f2f2f7;">
        <div style="flex: 1;">
          <h4 style="margin: 0; font-size: 0.95rem; font-weight: 700; color: #2c2c2c;">{{ item.name }}</h4>
          <span style="font-size: 0.85rem; color: #ff5500; font-weight: 600;">₱{{ item.price.toFixed(2) }}</span>
        </div>

        <!-- Quantity Controls -->
        <div style="display: flex; align-items: center; background: #f7f7f9; border-radius: 10px; padding: 4px 8px; gap: 10px;">
          <button (click)="decrease(item)" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; color: #555;">
            <ion-icon name="remove-outline" style="font-size: 0.9rem;"></ion-icon>
          </button>
          <span style="font-weight: 700; font-size: 0.9rem; min-width: 16px; text-align: center;">{{ item.quantity }}</span>
          <button (click)="increase(item)" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; color: #555;">
            <ion-icon name="add-outline" style="font-size: 0.9rem;"></ion-icon>
          </button>
        </div>
      </div>

      <!-- Bill Breakdown -->
      <div style="margin-top: 24px; background: #fafafa; padding: 16px; border-radius: 16px;">
        <div style="display: flex; justify-content: space-between; font-size: 0.88rem; color: #666; margin-bottom: 8px;">
          <span>Subtotal</span>
          <span style="font-weight: 600; color: #333;">₱{{ getSubtotal().toFixed(2) }}</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.88rem; color: #666; margin-bottom: 12px;">
          <span>Delivery Fee (Carig Campus)</span>
          <span style="font-weight: 600; color: #333;">₱25.00</span>
        </div>
        <div style="border-top: 1px dashed #ddd; padding-top: 10px; display: flex; justify-content: space-between; font-size: 1rem; font-weight: 800; color: #7b1113;">
          <span>Total Amount</span>
          <span>₱{{ getTotal().toFixed(2) }}</span>
        </div>
      </div>

      <!-- Proceed Button -->
      <ion-button expand="block" (click)="proceedToCheckout()" style="--background: linear-gradient(135deg, #ff7b00 0%, #ff5500 100%); --border-radius: 14px; height: 50px; font-weight: 700; font-size: 1rem; margin-top: 20px; --box-shadow: 0 8px 20px rgba(255, 107, 0, 0.3);">
        <span>PROCEED TO CHECKOUT</span>
        <ion-icon name="arrow-forward-outline" slot="end" style="margin-left: 6px;"></ion-icon>
      </ion-button>
    </div>

  </div>

</ion-content>
